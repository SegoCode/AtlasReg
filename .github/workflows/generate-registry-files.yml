name: Generate registry files

on:
  workflow_dispatch:

jobs:
  generate-registry-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Authenticate with GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Clone Atlas-OS/Atlas Repository
        run: |
          gh repo clone Atlas-OS/Atlas Atlas

      - name: Clone SegoCode/AtlasReg Repository
        run: |
          gh repo clone SegoCode/AtlasReg AtlasReg

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.20.0
          runtime: node@26.6.0
          install: false

      - name: Install Dependencies
        run: |
          cd AtlasReg/code
          pnpm install --frozen-lockfile

      - name: Run atlasreg.js Script
        run: |
          cd AtlasReg/code
          node atlasreg.js ../../Atlas/src/playbook/Configuration/tweaks ../docs/playbook

      - name: Commit and Push Changes
        run: |
          cd AtlasReg
          git add docs/playbook
          git commit -m "chore: update registry files" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SegoCode/AtlasReg.git HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
